[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "integration: requires the running local 8080 service",
  "e2e: starts browser automation or touches live UI",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
