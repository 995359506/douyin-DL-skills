<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>发送到抖音看板</title>
<style>
  :root { color-scheme:light; --ink:#171717; --muted:#666; --line:#eaeaea; --blue:#0070f3; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fafafa; color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
  main { width:min(100%,560px); margin:auto; padding:44px 24px calc(40px + env(safe-area-inset-bottom)); }
  .eyebrow { font:11px/1.5 ui-monospace,monospace; color:var(--muted); letter-spacing:.16em; }
  h1 { margin:16px 0 8px; font-size:34px; letter-spacing:-.05em; line-height:1.2; font-weight:600; }
  .intro { color:var(--muted); font-size:14px; margin:0 0 30px; }
  form { background:white; padding:24px; border:1px solid var(--line); }
  label { display:block; margin-bottom:8px; font-size:13px; font-weight:600; }
  input,textarea,button { font:inherit; border-radius:4px; }
  input,textarea { display:block; width:100%; padding:12px; border:1px solid #d4d4d4; background:white; color:var(--ink); }
  textarea { min-height:138px; resize:vertical; }
  input { margin-bottom:20px; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  button { padding:13px 18px; border:1px solid var(--ink); cursor:pointer; min-height:48px; }
  #send { width:100%; color:white; background:var(--ink); margin-top:18px; font-weight:600; }
  button:disabled { opacity:.5; cursor:wait; }
  #message { min-height:28px; font-size:14px; color:var(--blue); margin:16px 0 0; overflow-wrap:anywhere; }
  .error { color:#b42318 !important; }
  .section-head { display:flex; align-items:center; justify-content:space-between; margin-top:34px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  h2 { font-size:16px; margin:0; font-weight:600; }
  #refresh { background:transparent; border-color:var(--line); font-size:13px; min-height:42px; padding:7px 15px; }
  #receipts { list-style:none; margin:0; padding:0; }
  #receipts li { padding:18px 0; border-bottom:1px solid var(--line); }
  .status { display:block; font-size:14px; font-weight:500; }
  .meta { color:var(--muted); font:12px/1.7 ui-monospace,monospace; margin-top:6px; overflow-wrap:anywhere; }
  .empty,.foot { color:var(--muted); font-size:12px; }
  .empty { padding:20px 0; }
  .foot { margin-top:30px; }
  @media(max-width:380px) { main { padding:30px 16px; } form { padding:18px; } h1 { font-size:30px; } }
</style>
<main>
  <div class="eyebrow">DOUYIN / INBOX</div>
  <h1>看到好视频，<br>交给看板。</h1>
  <p class="intro">粘贴抖音分享内容，电脑上线后自动下载并总结。</p>
  <form id="form">
    <label for="token">收件口令</label>
    <input id="token" type="password" autocomplete="off" placeholder="首次使用时填写" required>
    <label for="share">视频链接或分享内容</label>
    <textarea id="share" placeholder="把刚才看到的那条视频粘贴到这里……" maxlength="8192" required></textarea>
    <button id="send" type="submit">发送到看板 ↗</button>
    <p id="message" role="status" aria-live="polite"></p>
  </form>
  <div class="section-head"><h2>最近提交</h2><button id="refresh" type="button">刷新状态</button></div>
  <ul id="receipts"><li class="empty">填写口令后，可以查看已提交视频的处理状态。</li></ul>
  <p class="foot">服务器只暂存链接。电脑需开机联网，视频与总结保存在电脑看板中。下载间隔 30 秒，总结独立处理。</p>
</main>
<script>
  const $ = id => document.getElementById(id);
  const base = new URL(new URLSearchParams(location.search).get('server') || '.', location.href);
  let pending;
  try { $('token').value = localStorage.getItem('douyin-inbox-token') || ''; } catch {}
  function message(text, error=false) { $('message').textContent=text; $('message').classList.toggle('error',error); }
  async function request(path,body) {
    const response=await fetch(new URL(path,base),{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)});
    const result=await response.json();
    if(!response.ok||!result.success) throw new Error(result.message||'暂时无法连接，请稍后重试');
    try { localStorage.setItem('douyin-inbox-token',$('token').value); } catch {}
    return result;
  }
  async function refresh() {
    const result=await request('api/receipts');
    $('receipts').replaceChildren();
    if(!result.data.length) { const li=document.createElement('li'); li.className='empty'; li.textContent='还没有提交记录。'; $('receipts').append(li); }
    for(const row of result.data) {
      const li=document.createElement('li'),status=document.createElement('span'),meta=document.createElement('div');
      status.className='status'; status.textContent=row.message;
      meta.className='meta'; meta.textContent=new Date(row.created_at*1000).toLocaleString('zh-CN')+' · '+row.receipt_id.slice(0,8);
      li.append(status,meta); $('receipts').append(li);
    }
  }
  $('form').addEventListener('submit',async event=>{
    event.preventDefault();
    const text=$('share').value.trim();
    if(!pending||pending.text!==text) pending={text,request_id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)};
    $('send').disabled=true; message('正在发送……');
    try {
      const result=await request('api/receipts',pending);
      message(result.message+'。可以继续刷视频了。'); pending=undefined; $('share').value='';
      await refresh().catch(()=>message('链接已接收。状态暂时无法刷新，可以稍后再查看。'));
    }
    catch(error) { message(error.name==='TimeoutError'?'请求超时，请再次点击发送，会沿用原提交编号。':error.message,true); }
    finally { $('send').disabled=false; }
  });
  $('refresh').addEventListener('click',()=>refresh().catch(error=>message(error.message,true)));
  if($('token').value) refresh().catch(error=>message(error.message,true));
</script>
</html>
